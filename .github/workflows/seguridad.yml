name: Seguridad

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Auditar dependencias bloqueadas en uv.lock
        # setuptools queda fijado en <81 (ver pyproject.toml); sus avisos se revisan a mano.
        run: |
          uv export --frozen --no-hashes --format requirements-txt > requisitos.txt
          uvx pip-audit --no-deps --disable-pip -r requisitos.txt \
            --ignore-vuln PYSEC-2026-3447 \
            --ignore-vuln GHSA-xmj3-9gf7-h52w

  codigo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Análisis estático con bandit
        run: uvx bandit -q -r scripts agentes observatorio -ll -s B310
