[project]
name = "friendly-fiesta"
version = "0.1.0"
description = "Notebooks didácticos: mínimos cuadrados, SGD y backpropagation de un MLP"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "plotly>=5.24",
    "kaleido>=0.2.1",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "polars>=2.0.0",
    "nltk>=3.10.4",
    "spacy>=3.8.18",
    "wordcloud>=1.9.6",
    "emoji>=2.16.0",
    "lazypredict>=0.4.0",
    "shap>=0.54.1",
    "tpot>=1.1.0",
    "setuptools<81",
    "spylls>=0.1.7",
    "es-core-news-sm",
    "flask>=3.1.3",
    "yt-dlp>=2026.10.26",
    "sentencepiece>=0.2.3",
    "google-adk>=2.14.1",
    "litellm>=1.109.1",
]

[dependency-groups]
dev = [
    "nbconvert>=7.16",
]

[tool.uv]
package = false

[tool.uv.sources]
es-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl" }
