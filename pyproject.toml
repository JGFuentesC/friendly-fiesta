[project]
name = "friendly-fiesta"
version = "0.1.0"
description = "Notebook didáctico: mínimos cuadrados matriciales y descenso de gradiente estocástico"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.9",
    "jupyterlab>=4.2",
]

[dependency-groups]
dev = [
    "nbconvert>=7.16",
]

[tool.uv]
package = false
